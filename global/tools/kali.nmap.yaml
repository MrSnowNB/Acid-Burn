id: kali.nmap
kind: atom
tier: global
version: 2
author: human
description: Perform network service discovery and fingerprinting using nmap. Hardened v1.1.

implementation:
  kind: kali_cli
  binary: nmap
  toolchain:
    python_package: atoms.nmap
    command_builder: command_builder.build_command
    output_parser: output_parser.parse
  requires_sudo: true

execution:
  timeout_seconds: 300

parameters:
  - name: target
    type: string
    required: true
    description: Target host, network, or list (e.g., 192.168.1.0/24, example.com, 10.0.0.1-10.0.0.5)
    validation_regex: ^([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(\/[0-9]{1,2})?|[0-9a-fA-F:]{2,39}(\/[0-9]{1,3})?|[\w.-]+)([,\s]+([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(\/[0-9]{1,2})?|[0-9a-fA-F:]{2,39}(\/[0-9]{1,3})?|[\w.-]+))*$
    flags:
      - --reason
  - name: scan_type
    type: enum
    required: false
    default: host-discovery
    description: Scan type selection — atomic values only. Composite behavior (aggressive, stealth) is achieved by combining standalone parameters instead.
    options:
      - host-discovery: "Ping sweep only (-sn)"
      - syn-scan: "TCP SYN stealth scan (-sS)"
      - connect-scan: "TCP connect scan (-sT)"
      - udp-scan: "UDP scan (-sU)"
      - os-detect: "OS detection (-O)"
      - version-detect: "Service/version detection (-sV)"
      - script-scan: "NSE script scan (-sC or --script=)"
      - traceroute: "Traceroute (--traceroute)"
    flags:
      - host-discovery: -sn
      - syn-scan: -sS
      - connect-scan: -sT
      - udp-scan: -sU
      - os-detect: -O
      - version-detect: -sV
      - script-scan: -sC
      - traceroute: --traceroute
  - name: ports
    type: string
    required: false
    default: "1-1024"
    description: Port specification (e.g., 1-65535, 80,443, U:53, U:123, tcp:80, udp:53)
    validation_regex: ^([0-9]{1,5}(-[0-9]{1,5})?)(,[0-9]{1,5}(-[0-9]{1,5})?)*$|^([UuTt]:[0-9]{1,5})$|^([Tt][0-9]{1,5})(-[0-9]{1,5})?$
    flags:
      - -p
  - name: output_format
    type: enum
    required: false
    default: xml
    description: Output format selection
    options:
      - xml: "XML output (-oX)"
      - normal: "Normal text output (-oN)"
      - grepable: "Grepable output (-oG)"
    flags:
      - xml: -oX
      - normal: -oN
      - grepable: -oG

outputs:
  artifact_path: 'sessions/{session}/artifacts/nmap-{ts}.xml'
  type: nmap.scan.v1

preconditions:
- scope.includes(inputs.target)
- network.reachable(inputs.target)

postconditions:
- artifact_exists(outputs.artifact_path)
- result.hosts|length > 0

risk: low
side_effects:
- network_probe
reversible: true
promotion:
  required_distinct_inputs: 3
  required_success: 3
  requires_human_review: false
trials:
  failure: 0
  last_run: null
  success: 0
