id: web.gobuster
kind: atom
tier: global
version: 4
author: hermes
description: Web directory enumeration using Gobuster — discovers hidden directories and files on web servers.

implementation:
  kind: shell
  cmd: gobuster dir -u http://{target} -w {wordlist} {flags}

execution:
  timeout_seconds: 120

inputs:
  flags:
    default: -f --no-error -q -t 10
    type: string
  target:
    type: string
    required: true
    validator: rfc1123_host_or_ip
  wordlist:
    default: /usr/share/wordlists/dirb/small.txt
    type: string

outputs:
  artifact_path: sessions/{session}/artifacts/gobuster-{ts}.raw
  type: gobuster.enum.v1

preconditions:
- scope.includes(inputs.target)
- network.reachable(inputs.target)

postconditions:
- artifact_exists(outputs.artifact_path)
- result.total_findings is not None

risk: low
side_effects:
- network_probe
reversible: true
promotion:
  required_success: 3
  required_distinct_inputs: 3
  requires_human_review: false
trials:
  success: 0
  failure: 0
  last_run: null
