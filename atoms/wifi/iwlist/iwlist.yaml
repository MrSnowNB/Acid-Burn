schema_version: 1.1
id: wifi.iwlist
kind: atom
name: iwlist Basic AP Scan
version: 0.1.0

description: >
  Simple passive scan using iwlist. Lower capability than airodump-ng
  but useful as a lightweight baseline and when monitor mode is unavailable.

safety_class: passive_recon
implementation:
  kind: kali_cli
  binary: iwlist
  toolchain:
    python_package: atoms.wifi.iwlist
    command_builder: command_builder.build_command
    output_parser: output_parser.parse_iwlist_output
  requires_sudo: true

parameters:
  - name: interface
    type: string
    required: true
    description: Wireless interface (does not need to be in monitor mode)

  - name: duration
    type: integer
    required: false
    default: 10
    description: Not directly supported by iwlist (kept for interface consistency)
