schema_version: 1.0
atom_type: tool_invocation
name: nmap-service-scan
source_tool: nmap
command_template: "sudo nmap -sS -sV --top-ports {port_count} {targets} -oX {output_file} -T4 --host-timeout 30s"
parameters:
  - name: port_count
    type: integer
    required: true
    description: "Number of top ports to scan (e.g., 100, 1000)"
  - name: targets
    type: list
    required: true
    description: "Space-separated list of target IPs or CIDR ranges"
  - name: output_file
    type: path
    required: true
    description: "Output file path for XML results"
output_parser:
  format: xml
  parse_command: "python3 -c \"import xml.etree.ElementTree as ET; tree = ET.parse('{output_file}'); root = tree.getroot(); hosts = root.findall('host'); [print(f\\\"{h.find('address[@addrtype=\\\\\\\"ipv4\\\\\\\"]').get('addr')}: {h.find('address[@addrtype=\\\\\\\"mac\\\\\\\"]').get('addr') if h.find('address[@addrtype=\\\\\\\"mac\\\\\\\"]') is not None else 'N/A'} {h.find('address[@addrtype=\\\\\\\"mac\\\\\\\"]').get('vendor') if h.find('address[@addrtype=\\\\\\\"mac\\\\\\\"]') is not None else ''}\\n\\\", h.find('hostnames/hostname').get('name') if h.find('hostnames/hostname') is not None else '', 'Port: ' + port.get('portid') + '/' + port.get('protocol') + ' - ' + port.find('state').get('state') + ' - ' + port.find('service').get('name') if port.find('state') is not None and port.find('state').get('state') == 'open' else '') for h in hosts for port in (h.find('ports') if h.find('ports') is not None else [])]\""
  record_schema:
    - field: ip_address
      type: string
      source: address[@addrtype="ipv4"]/@addr
    - field: mac_address
      type: string
      source: address[@addrtype="mac"]/@addr
    - field: vendor
      type: string
      source: address[@addrtype="mac"]/@vendor
    - field: hostname
      type: string
      source: hostnames/hostname/@name
    - field: port
      type: integer
      source: port/portid
    - field: protocol
      type: string
      source: port/@protocol
    - field: state
      type: string
      source: port/state/@state
    - field: service
      type: string
      source: port/service/@name
    - field: version
      type: string
      source: port/version/text()
    - field: cpes
      type: list
      source: port/cpe/text()
rubric_score: 29
safety_class: active_scan
idempotency_class: pure
preconditions:
  - "test -f /usr/bin/nmap"
  - "sudo nmap -sn -PR 127.0.0.0/24 >/dev/null 2>&1"
postconditions:
  - "test -f {output_file}"
  - "python3 -c \"import xml.etree.ElementTree as ET; ET.parse('{output_file}')\""
example_invocation:
  input:
    port_count: "100"
    targets: "192.168.9.1 192.168.9.148 192.168.9.190 192.168.9.200"
    output_file: "/home/mark/Desktop/hybrid_scratchpad/recon_outputs/nmap_services.xml"
  expected_output_pattern: "Nmap scan report for.*Not shown:.*tcp ports.*Nmap done:"
