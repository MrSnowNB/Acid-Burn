schema_version: 1.0
atom_type: tool_invocation
name: nmap-host-discovery
source_tool: nmap
command_template: "sudo nmap -sn -PR {cidr} -oX {output_file}"
parameters:
  - name: cidr
    type: cidr
    required: true
    description: "Target network range in CIDR notation (e.g., 192.168.1.0/24)"
  - name: output_file
    type: path
    required: true
    description: "Output file path for XML results"
output_parser:
  format: xml
  parse_command: "python3 -c \"import xml.etree.ElementTree as ET; tree = ET.parse('{output_file}'); root = tree.getroot(); hosts = root.findall('host'); [print(f\\\"{h.find('address[@addrtype=\\\\\\\"ipv4\\\\\\\"]').get('addr')}: {h.find('address[@addrtype=\\\\\\\"mac\\\\\\\"]').get('macaddr')} {h.find('address[@addrtype=\\\\\\\"mac\\\\\\\"]').get('vendor') if h.find('address[@addrtype=\\\\\\\"mac\\\\\\\"]') is not None else ''}\\n\\\", h.find('hostnames/hostname').get('name') if h.find('hostnames/hostname') is not None else '') for h in hosts]\""
  record_schema:
    - field: ip_address
      type: string
      source: address[@addrtype="ipv4"]/@addr
    - field: mac_address
      type: string
      source: address[@addrtype="mac"]/@addr
    - field: vendor
      type: string
      source: address[@addrtype="mac"]/@vendor
    - field: hostname
      type: string
      source: hostnames/hostname/@name
rubric_score: 28
safety_class: active_scan
idempotency_class: pure
preconditions:
  - "test -f /usr/bin/nmap"
  - "sudo nmap -sn -PR 127.0.0.0/24 >/dev/null 2>&1"
postconditions:
  - "test -f {output_file}"
  - "python3 -c \"import xml.etree.ElementTree as ET; ET.parse('{output_file}')\""
example_invocation:
  input:
    cidr: "192.168.9.0/24"
    output_file: "/home/mark/Desktop/hybrid_scratchpad/recon_outputs/nmap_discovery.xml"
  expected_output_pattern: "Nmap scan report for.*Host is up.*Nmap done:.*IP addresses.*hosts up"
