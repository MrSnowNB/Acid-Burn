schema_version: 1.1
atom_type: tool_invocation
name: nmap
source_tool: nmap
command_template: nmap [OPTIONS] [TARGETS]
description: Universal nmap invocation atom covering all scan types, output formats, timing, and targeting options
parameters:
  - name: target
    type: string
    required: true
    description: Target host, network, or list (e.g., 192.168.1.0/24, example.com, 10.0.0.1-10.0.0.5)
    validation_regex: ^([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(\/[0-9]{1,2})?|[0-9a-fA-F:]{2,39}(\/[0-9]{1,3})?|[\w.-]+)([,\s]+([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(\/[0-9]{1,2})?|[0-9a-fA-F:]{2,39}(\/[0-9]{1,3})?|[\w.-]+))*$
    flags:
      - --reason
  - name: scan_type
    type: enum
    required: false
    default: host-discovery
    description: Scan type selection — atomic values only. Composite behavior (aggressive, stealth) is achieved by combining standalone parameters instead.
    options:
      - host-discovery: "Ping sweep only (-sn)"
      - syn-scan: "TCP SYN stealth scan (-sS)"
      - connect-scan: "TCP connect scan (-sT)"
      - udp-scan: "UDP scan (-sU)"
      - os-detect: "OS detection (-O)"
      - version-detect: "Service/version detection (-sV)"
      - script-scan: "NSE script scan (-sC or --script=)"
      - traceroute: "Traceroute (--traceroute)"
    flags:
      - host-discovery: -sn
      - syn-scan: -sS
      - connect-scan: -sT
      - udp-scan: -sU
      - os-detect: -O
      - version-detect: -sV
      - script-scan: -sC
      - traceroute: --traceroute
    conflicts:
      - - traceroute conflicts with: syn-scan, connect-scan (traceroute requires UDP probe, not TCP connect)
      - - udp-scan conflicts with: syn-scan, connect-scan (UDP and TCP are mutually exclusive)
  - name: ports
    type: string
    required: false
    default: "1-1024"
    description: Port specification (e.g., 1-65535, 80,443, U:53, U:123, tcp:80, udp:53)
    validation_regex: ^([0-9]{1,5}(-[0-9]{1,5})?)(,[0-9]{1,5}(-[0-9]{1,5})?)*$|^([UuTt]:[0-9]{1,5})$|^([Tt][0-9]{1,5})(-[0-9]{1,5})?$
    flags:
      - -p
  - name: output_format
    type: enum
    required: false
    default: xml
    description: Output format selection
    options:
      - xml: "XML output (-oX)"
      - normal: "Normal text output (-oN)"
      - grepable: "Grepable output (-oG)"
      - xml_and_normal: "Both XML and normal (-oX + -oN)"
      - xml_and_grepable: "Both XML and grepable (-oX + -oG)"
      - all: "All formats (XML, Normal, Grepable, XML interactive) (-oA)"
    flags:
      - xml: -oX
      - normal: -oN
      - grepable: -oG
      - xml_and_normal: ["-oX", "-oN"]
      - xml_and_grepable: ["-oX", "-oG"]
      - all: -oA
  - name: output_file
    type: path
    required: false
    default: "stdout"
    description: Output file path (required when output_format != stdout). Must not contain directory traversal sequences.
    validation_regex: ^(?!\.\.)([/\w.-]+)$
    flags:
      - -o
  - name: timing_template
    type: enum
    required: false
    default: aggressive
    description: Timing template for scan speed control
    options:
      - paranoid: "Slowest (-T0) - evade IDS"
      - sneaky: "Slow (-T1) - evade IDS"
      - polite: "Polite (-T2) - reduces bandwidth"
      - normal: "Normal (-T3) - default"
      - aggressive: "Aggressive (-T4) - fastest reliable"
      - insane: "Insane (-T5) - very fast, may miss hosts"
    flags:
      - paranoid: -T0
      - sneaky: -T1
      - polite: -T2
      - normal: -T3
      - aggressive: -T4
      - insane: -T5
  - name: host_timeout
    type: duration
    required: false
    default: 60
    description: Per-host timeout in seconds (nmap accepts duration strings like '60s', '5m', '2h')
    validation_regex: ^[0-9]+([smhd])?$
    flags:
      - --host-timeout
  - name: max_retries
    type: integer
    required: false
    default: 3
    minimum: 1
    maximum: 10
    description: Maximum port scan retries (1-10)
    flags:
      - --max-retries
  - name: dns_resolution
    type: boolean
    required: false
    default: true
    description: Enable DNS resolution. When false, disables lookup (--disable-lookup).
    flags:
      - dns_enabled: -R
      - dns_disabled: --disable-lookup
  - name: exclude_hosts
    type: list
    required: false
    default: []
    description: Hosts to exclude from scan (--exclude)
    flags:
      - --exclude
  - name: exclude_file
    type: path
    required: false
    default: ""
    description: File of hosts to exclude (--exclude-file). Must not contain directory traversal.
    validation_regex: ^(?!\.\.)([/\w.-]+)$
    flags:
      - --exclude-file
  - name: script
    type: string
    required: false
    default: ""
    description: NSE script to run (--script=). Comma-separated list of script names or categories.
    validation_regex: ^[a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*$
    flags:
      - --script
  - name: version_intensity
    type: integer
    required: false
    default: 7
    minimum: 0
    maximum: 9
    description: Version detection intensity 0-9 (higher = more probes, slower)
    flags:
      - --version-intensity
  - name: version_all
    type: boolean
    required: false
    default: false
    description: Try all version probes (-sV --version-all)
    flags:
      - --version-all
  - name: fragment
    type: boolean
    required: false
    default: false
    description: Fragment packets to evade IDS (-f)
    flags:
      - -f
  - name: data_length
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 65535
    description: Append random data to packets (--data-length N)
    flags:
      - --data-length
  - name: source_port
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 65535
    description: Source port (--source-port N)
    flags:
      - --source-port
  - name: interface
    type: string
    required: false
    default: ""
    description: Network interface to use (-e)
    flags:
      - -e
  - name: proxy
    type: string
    required: false
    default: ""
    description: Use proxy (-x) — e.g., socks5://localhost:9050
    flags:
      - -x
  - name: verbose
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 3
    description: Verbosity level 0-3 (-v, -vv, -vvv)
    flags:
      - verbose: ["-v", "-vv", "-vvv"]
  - name: stealth_mode
    type: boolean
    required: false
    default: false
    description: Stealth mode — disables DNS resolution, uses timing T4, fragments packets, randomizes targets
    flags:
      - stealth_mode: ["--disable-lookup", "-T4", "-f"]
  # ── Safety / blast-radius controls (P1 from Grok evaluation) ──────
  - name: max_rate
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 1000000
    description: Maximum send rate in packets per second (0=unlimited). Critical for blast radius control. (--max-rate)
    flags:
      - --max-rate
  - name: min_rate
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 1000000
    description: Minimum send rate in packets per second. (--min-rate)
    flags:
      - --min-rate
  - name: skip_host_discovery
    type: boolean
    required: false
    default: false
    description: Skip host discovery and scan all ports (-Pn). Useful when hosts are behind firewalls that block ping.
    flags:
      - -Pn
  - name: top_ports
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 10000
    description: Scan top N ports instead of manual port range (--top-ports). Overrides ports parameter when set.
    flags:
      - --top-ports
  - name: dns_servers
    type: list
    required: false
    default: []
    description: Custom DNS servers to use (--dns-servers). Comma-separated IPv4 addresses.
    validation_regex: ^(1[0-9]{2}|2[0-4][0-9]|25[0-5]|[1-9]?[0-9])(\.(1[0-9]{2}|2[0-4][0-9]|25[0-5]|[1-9]?[0-9])){3}(,\s*(1[0-9]{2}|2[0-4][0-9]|25[0-5]|[1-9]?[0-9])(\.(1[0-9]{2}|2[0-4][0-9]|25[0-5]|[1-9]?[0-9])){3})*$
    flags:
      - --dns-servers
  - name: max_hosts
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 65536
    description: Maximum number of hosts to scan simultaneously (--max-hosts).
    flags:
      - --max-hosts
  - name: reason
    type: string
    required: false
    default: ""
    description: Reason for scan (reported in XML output under <reason> tags). Required for active_scan safety class.
    flags:
      - --reason
output_parser:
  format: xml
  parse_command: "python3 /home/mark/Acid-Burn/atoms/nmap_xml_parser.py {output_file}"
  parser_module: /home/mark/Acid-Burn/atoms/nmap_xml_parser.py
  record_schema:
    - field: ip_address
      type: string
      source: address[@addrtype="ipv4"]/@addr
      nullable: true
    - field: mac_address
      type: string
      source: address[@addrtype="mac"]/@addr
      nullable: true
    - field: vendor
      type: string
      source: address[@addrtype="mac"]/@vendor
      nullable: true
    - field: hostname
      type: string
      source: hostnames/hostname/@name
      nullable: true
    - field: port
      type: integer
      source: port/portid
      nullable: false
    - field: protocol
      type: string
      source: port/@protocol
      nullable: false
    - field: state
      type: string
      source: port/state/@state
      nullable: false
      allowed_values: [open, closed, filtered, open|filtered, closed|filtered]
    - field: service
      type: string
      source: port/service/@name
      nullable: true
    - field: version
      type: string
      source: port/version/text()
      nullable: true
    - field: cpes
      type: list
      source: port/cpe/text()
      nullable: true
    - field: scripts
      type: list
      source: port/script/@id
      nullable: true
    - field: os_name
      type: string
      source: os/osmatch/@name
      nullable: true
    - field: os_accuracy
      type: integer
      source: os/osmatch/@accuracy
      nullable: true
rubric_score: null
safety_class: active_scan
idempotency_class: network_impure
preconditions:
  - "command -v nmap >/dev/null 2>&1"
  - "nmap --version 2>&1 | head -1"
  - "test -d /usr/share/nmap/scripts 2>/dev/null || test -d /usr/local/share/nmap/scripts 2>/dev/null"
  - "python3 -c 'import xml.etree.ElementTree' >/dev/null 2>&1"
  - "test -d $(dirname {output_file}) 2>/dev/null || mkdir -p $(dirname {output_file})"
postconditions:
  - "test $? -eq 0"
  - "test -s {output_file} 2>/dev/null"
  - "python3 -c 'import xml.etree.ElementTree as ET; ET.parse(\"{output_file}\")' 2>/dev/null"
  - "grep -q 'nmaprun' {output_file}"
example_invocations:
  - name: host-discovery
    description: Quick ping sweep to find live hosts on a subnet
    input:
      target: "192.168.9.0/24"
      scan_type: "host-discovery"
      output_format: "xml"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_discovery.xml"
      max_rate: 1000
      reason: "Authorized local network discovery"
    expected_output_pattern: "Nmap scan report for.*Host is up.*Nmap done:.*IP addresses.*hosts up"
  - name: syn-scan-top-ports
    description: Fast TCP SYN scan of top 100 ports
    input:
      target: "192.168.9.1"
      scan_type: "syn-scan"
      top_ports: 100
      output_format: "xml"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_syn_scan.xml"
      max_rate: 500
      reason: "Authorized service enumeration"
    expected_output_pattern: "Nmap scan report for.*Not shown:.*tcp ports.*Nmap done:"
  - name: service-detection
    description: Full service/version detection on known hosts
    input:
      target: "192.168.9.1 192.168.9.148 192.168.9.190 192.168.9.200"
      scan_type: "version-detect"
      output_format: "xml"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_services.xml"
      max_rate: 200
      reason: "Authorized service version detection"
    expected_output_pattern: "Service detection performed.*Nmap done:"
  - name: aggressive-scan
    description: Aggressive scan with OS detection, version detection, and default scripts
    input:
      target: "192.168.9.1"
      scan_type: "syn-scan"
      ports: "1-1024"
      version_intensity: 7
      script: "default,safe"
      timing_template: "aggressive"
      output_format: "xml"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_aggressive.xml"
      max_rate: 300
      reason: "Authorized security assessment on owned infrastructure"
    expected_output_pattern: "Nmap scan report for.*OS details.*Service detection.*Nmap done:"
  - name: udp-scan
    description: UDP scan of common ports (DNS, NTP, SNMP)
    input:
      target: "192.168.9.1"
      scan_type: "udp-scan"
      output_format: "xml"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_udp.xml"
      max_rate: 50
      reason: "Authorized UDP service discovery"
    expected_output_pattern: "Nmap scan report for.*UDP.*Nmap done:"
  - name: nse-script-scan
    description: Run specific NSE scripts (e.g., smb-enum-shares, http-enum)
    input:
      target: "192.168.9.148"
      scan_type: "syn-scan"
      ports: "139,445"
      script: "smb-enum-shares,smb-os-info"
      output_format: "xml"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_smb.xml"
      max_rate: 100
      reason: "Authorized SMB share enumeration"
    expected_output_pattern: "Nmap scan report for.*smb-enum-shares.*Nmap done:"
  - name: stealth-scan
    description: Evade IDS with slow, fragmented, no-DNS scan
    input:
      target: "192.168.9.0/24"
      scan_type: "host-discovery"
      timing_template: "paranoid"
      fragment: true
      dns_resolution: false
      output_format: "xml"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_stealth.xml"
      max_rate: 10
      reason: "Authorized IDS-evasion reconnaissance"
    expected_output_pattern: "Nmap scan report for.*Host is up.*Nmap done:"
  - name: traceroute
    description: Traceroute to target
    input:
      target: "example.com"
      scan_type: "traceroute"
      output_format: "normal"
      output_file: "/home/mark/Acid-Burn/recon_outputs/nmap_traceroute.txt"
      max_rate: 20
      reason: "Network topology assessment"
    expected_output_pattern: "Nmap scan report for.*TRACEROUTE.*HOP.*RTT"
orthogonality_review:
  reviewed_utc: "2026-05-16T19:15Z"
  reviewer: "Grok Build CLI (grok-code-fast-1) + human review pending"
  conflicts_documented:
    - scan_type=traceroute is mutually exclusive with: syn-scan, connect-scan, udp-scan (traceroute requires UDP probe)
    - udp-scan is mutually exclusive with: syn-scan, connect-scan
    - stealth_mode and timing_template both affect timing — stealth_mode overrides timing_template to T4
    - fragment and stealth_mode overlap — stealth_mode includes fragment
  resolution_strategy: "Use atomic scan_type values only. Composite behavior achieved by combining standalone parameters (timing_template, fragment, dns_resolution, stealth_mode). scan_type removed aggressive and stealth-udp in v1.1 to enforce orthogonality."
  parameters_removed_from_enum:
    - aggressive: "Replaced by combining scan_type=syn-scan + timing_template=aggressive + version_intensity + script=default"
    - stealth-udp: "Replaced by combining scan_type=udp-scan + ports=--top-ports + fragment=true + dns_resolution=false + timing_template=sneaky"
